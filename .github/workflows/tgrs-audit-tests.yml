name: TGRS code-audit and PatchShot core tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install light test dependencies
        run: python -m pip install numpy scikit-learn matplotlib
      - name: Test code-audit and PatchShot readout helpers
        run: python -m unittest discover -s tests -v
      - name: Build three source-covered Figure 4 panels
        run: python scripts/plot_verified_figure4.py --out_dir /tmp/tgrs_figure4
      - name: Check Figure 4 panel files
        run: test -s /tmp/tgrs_figure4/figure4_b_verified_radar_budget.pdf && test -s /tmp/tgrs_figure4/figure4_c_verified_radar_readouts.pdf && test -s /tmp/tgrs_figure4/figure4_d_verified_paired_gains.pdf
      - name: Check Python syntax of imported code
        run: python -m py_compile patchshot/*.py scripts/run_patchshot.py scripts/run_oof_probes.py scripts/plot_verified_figure4.py tools/*.py
