name: TGRS code-audit and PatchShot core tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install light test dependencies
        run: python -m pip install numpy scikit-learn
      - name: Test code-audit and PatchShot readout helpers
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax of imported core
        run: python -m py_compile patchshot/*.py scripts/run_patchshot.py tools/audit_instability.py
