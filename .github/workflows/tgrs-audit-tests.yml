name: TGRS methods-only code tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  method-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: python -m pip install numpy scikit-learn
      - name: Run synthetic algorithm checks
        run: python -m unittest discover -s tests -v
      - name: Check method script syntax
        run: python -m py_compile patchshot/*.py scripts/run_patchshot.py scripts/run_oof_probes.py tools/audit_instability.py
      - name: Verify no committed experiment result files
        run: |
          test ! -e reference_results
          ! git ls-files | grep -E '(^|/)(.*per_seed.*|figure4_verified_.*|matched_ce_20pct.*)\.csv$'
